       3. cle "dup_key" declaree deux fois dans le bloc fr (doublon) ;
       4. ancre #nowhere sans element correspondant (ancre cassee) ;
       5. un attribut data-i18n vide ;
       6. du texte visible non couvert par un attribut de traduction et absent

          ment le titre et les liens de navigation de ce temoin).
